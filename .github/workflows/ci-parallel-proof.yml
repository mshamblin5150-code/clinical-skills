# One approved diagnostic job, not a population retry or a repair.
# First observe the unprimed prefix; separately observe a fresh status-primed copy.
name: reader preflight status diagnosis

on:
  push:
    branches: [diagnostic/2013-parallel-proof-20261020]

permissions:
  contents: read

jobs:
  preflight-status:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Record whole-job deadline origin
        shell: pwsh
        run: |
          "PREFLIGHT_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Unprimed observer at the failed revision
        uses: actions/checkout@v7
        with:
          ref: 96a8c794b71184881fbaa9b3df471fecf2f9b331
          path: observer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Unchanged immutable source seed
        uses: actions/checkout@v7
        with:
          ref: 38c431b15b7fafb0f5f89a67ecb501de318c47a1
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Diagnostic helper separately from observer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-helper
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /diagnostics/preflight_status_diagnostic.py
            /diagnostics/measure_parallel_readers.py
            /diagnostics/parallel_reader_capture.py
            /diagnostics/parallel_reader_diagnostics.py
            /diagnostics/parallel_reader_scheduler.py
            /diagnostics/windows_job_probe.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Same exact interpreter without project package installation
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Original import and first-status prefix without status priming
        id: unprimed
        continue-on-error: true
        shell: pwsh
        run: |
          python diagnostic-helper/diagnostics/preflight_status_diagnostic.py --mode unprimed --observer observer --seed source-seed --job-start-epoch $env:PREFLIGHT_JOB_START_EPOCH
          exit $LASTEXITCODE

      - name: Admit a second fresh observation only with time remaining
        id: second
        continue-on-error: true
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [double]$env:PREFLIGHT_JOB_START_EPOCH
          if ($elapsed -lt 0 -or $elapsed -ge 420) {
            Write-Output '{"event":"hold","reason":"second_observation_budget_unavailable"}'
            exit 2
          }
          'admitted=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Separate pinned observer for the status-primed observation
        if: steps.second.outputs.admitted == 'true'
        uses: actions/checkout@v7
        with:
          ref: 96a8c794b71184881fbaa9b3df471fecf2f9b331
          path: observer-primed
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Capture pre-import status through the separate helper owner
        id: before
        if: steps.second.outputs.admitted == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          python diagnostic-helper/diagnostics/preflight_status_diagnostic.py --mode capture-before --observer observer-primed --seed source-seed --job-start-epoch $env:PREFLIGHT_JOB_START_EPOCH
          exit $LASTEXITCODE

      - name: Observe the status-primed prefix in a fresh Python process
        id: primed
        if: steps.before.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          BEFORE_STATUS_FILE: ${{ steps.before.outputs.before_status }}
        run: |
          python diagnostic-helper/diagnostics/preflight_status_diagnostic.py --mode status-primed --observer observer-primed --seed source-seed --before-status "$env:BEFORE_STATUS_FILE" --job-start-epoch $env:PREFLIGHT_JOB_START_EPOCH
          exit $LASTEXITCODE

      - name: Preserve every hold and state the diagnostic boundary
        if: always()
        shell: pwsh
        env:
          UNPRIMED_OUTCOME: ${{ steps.unprimed.outcome }}
          PRIMED_OUTCOME: ${{ steps.primed.outcome }}
        run: |
          Write-Output '{"event":"diagnostic_boundary","full_original_preflight_passed":false,"controls_run":false,"population_run":false,"speed_claim_allowed":false,"raw_reports_uploaded":false}'
          if ($env:UNPRIMED_OUTCOME -ne 'success' -or $env:PRIMED_OUTCOME -ne 'success') { exit 2 }

# No artifact upload, additional workflow, dispatch, PR trigger, matrix, secrets,
# dependency installation, retry, deletion, or changes to checks.yml/tracker.yml.
