# One approved diagnostic push, not a population benchmark or adoption.
name: reader clone inventory diagnostic

on:
  push:
    branches: [diagnostic/2013-parallel-proof-20261020]

permissions:
  contents: read

jobs:
  inventory-diagnostic:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Record whole-job budget origin
        shell: pwsh
        run: |
          "PROOF_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Observer and reviewed lazy candidate only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: observer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Immutable full source seed
        uses: actions/checkout@v7
        with:
          ref: 38c431b15b7fafb0f5f89a67ecb501de318c47a1
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Exact maintainer interpreter without installation of packages
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Diagnose fresh checkout inventories without population probes
        shell: pwsh
        run: |
          python observer/diagnostics/clone_inventory_diagnostic.py --observer observer --seed source-seed --job-start-epoch $env:PROOF_JOB_START_EPOCH
          exit $LASTEXITCODE

# No artifact upload, workflow_dispatch, PR event, matrix, secret, package install,
# write token, retry, production scheduler change, or population benchmark.
