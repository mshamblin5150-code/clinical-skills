# Restores this trigger to lazy qualification only. No parallel workload runs.
name: lazy message qualification

on:
  push:
    branches: [diagnostic/2013-parallel-proof-20261020]

permissions:
  contents: read

jobs:
  lazy-qualification:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Record whole-job budget origin
        shell: pwsh
        run: |
          "PROOF_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Immutable reviewed observer and lazy candidate
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: observer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Fresh pinned full source seed with conversion disabled before checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: cb0507279e4e6b66ad40d10bc746b0e0b699291e
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Exact interpreter without installing packages
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Qualify controls then twenty alternating module probes
        shell: pwsh
        run: |
          $reviewedBudgetSha256 = 'ae23ebfc010736b0c942ea66f496e0edeb92bb15efe2d0b0275b6bb9a5799b70'
          python observer/diagnostics/measure_lazy_suite_ids.py --observer observer --seed source-seed --budget-sha256 $reviewedBudgetSha256 --job-start-epoch $env:PROOF_JOB_START_EPOCH
          exit $LASTEXITCODE

# No workflow_dispatch, PR event, matrix, upload, secret, write token, package
# installation, automatic rerun, production scheduler, or checks.yml change.
