# One approved A/B diagnostic job, not a population retry or an adopted fix.
# Both observations are fresh and unprimed; only the pinned ignore input differs.
name: reader pinned ignore comparison

on:
  push:
    branches: [diagnostic/2013-parallel-proof-20261020]

permissions:
  contents: read

jobs:
  preflight-status:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Record whole-job deadline origin
        shell: pwsh
        run: |
          "PREFLIGHT_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh baseline observer at the failed revision
        uses: actions/checkout@v7
        with:
          ref: 96a8c794b71184881fbaa9b3df471fecf2f9b331
          path: observer-baseline
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Unchanged immutable source seed
        uses: actions/checkout@v7
        with:
          ref: 38c431b15b7fafb0f5f89a67ecb501de318c47a1
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Diagnostic helper separately from observer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-helper
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /diagnostics/preflight_status_diagnostic.py
            /diagnostics/measure_parallel_readers.py
            /diagnostics/parallel_reader_capture.py
            /diagnostics/parallel_reader_diagnostics.py
            /diagnostics/parallel_reader_scheduler.py
            /diagnostics/windows_job_probe.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Same exact interpreter without project package installation
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Unprimed baseline original import and first-status prefix
        id: baseline
        continue-on-error: true
        shell: pwsh
        run: |
          python diagnostic-helper/diagnostics/preflight_status_diagnostic.py --mode baseline --observer observer-baseline --seed source-seed --job-start-epoch $env:PREFLIGHT_JOB_START_EPOCH
          exit $LASTEXITCODE

      - name: Admit a second fresh observation only with time remaining
        id: second
        continue-on-error: true
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [double]$env:PREFLIGHT_JOB_START_EPOCH
          if ($elapsed -lt 0 -or $elapsed -ge 420) {
            Write-Output '{"event":"hold","reason":"second_observation_budget_unavailable"}'
            exit 2
          }
          'admitted=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fresh candidate observer with existing pinned ignore input
        if: steps.second.outputs.admitted == 'true'
        uses: actions/checkout@v7
        with:
          ref: 96a8c794b71184881fbaa9b3df471fecf2f9b331
          path: observer-candidate
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Unprimed candidate original import and first-status prefix
        id: candidate
        if: steps.second.outputs.admitted == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          python diagnostic-helper/diagnostics/preflight_status_diagnostic.py --mode candidate --observer observer-candidate --seed source-seed --job-start-epoch $env:PREFLIGHT_JOB_START_EPOCH
          exit $LASTEXITCODE

      - name: Preserve every hold and state the diagnostic boundary
        if: always()
        shell: pwsh
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          BASELINE_RESULT: ${{ steps.baseline.outputs.comparison_result }}
          CANDIDATE_RESULT: ${{ steps.candidate.outputs.comparison_result }}
        run: |
          Write-Output '{"event":"diagnostic_boundary","full_original_preflight_passed":false,"controls_run":false,"population_run":false,"speed_claim_allowed":false,"raw_reports_uploaded":false}'
          if ($env:BASELINE_OUTCOME -ne 'success' -or $env:CANDIDATE_OUTCOME -ne 'success' -or $env:BASELINE_RESULT -ne 'baseline_reproduced' -or $env:CANDIDATE_RESULT -ne 'candidate_clean') { exit 2 }
          Write-Output '{"event":"comparison_result","baseline_reproduced":true,"candidate_first_guard_clean":true,"mitigation_observed":true,"root_cause_proven":false,"production_adoption":false}'

# No artifact upload, additional workflow, dispatch, PR trigger, matrix, secrets,
# dependency installation, retry, deletion, or changes to checks.yml/tracker.yml.
