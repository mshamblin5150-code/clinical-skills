# Temporary setup-only diagnostic. No qualification or performance workload.
name: original-source two-root diagnostic

on:
  push:
    branches: [diagnostic/2013-parallel-proof-20261020]

permissions:
  contents: read

jobs:
  lazy-setup-diagnostic:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Record whole-job budget origin
        shell: pwsh
        run: |
          "PROOF_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Immutable reviewed observer and lazy candidate
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: observer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Fresh pinned full source seed with conversion disabled before checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: cb0507279e4e6b66ad40d10bc746b0e0b699291e
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Exact interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Observe native ownership and two original-source roots
        shell: pwsh
        run: |
          python observer/diagnostics/diagnose_lazy_setup.py --observer observer --seed source-seed --job-start-epoch $env:PROOF_JOB_START_EPOCH
          exit $LASTEXITCODE

# No workflow_dispatch, PR event, matrix, upload, secret, write token, package
# install command, automatic rerun, production scheduler, or checks.yml change.
