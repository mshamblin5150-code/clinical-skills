# The suite, run somewhere the committer cannot opt out of. Issue #86, ADR 0002.
#
# The subject is the merge. `tools/hooks/pre-commit` does not fire on an
# automatic merge commit at all, and where a merge is hand-resolved the result
# is a tree neither parent ever had -- so `main` can hold a combination nobody
# ran the suite against. Two branches have already broken it exactly that way:
# `anchor_scan.py` and `block_scan.py` against the `console_codec` rule, both
# green on their own branch and red once merged.
#
# **Advisory by ruling, not by omission.** Nothing here is a required status
# check. A red run reports; it blocks nothing, and `git merge --no-ff` followed
# by `git push origin main` stays the way changes land. What this buys is the
# guarantee that the detection ran -- see ADR 0002 for why that was judged to be
# the whole of the value.
#
# `tools/test_ci_workflow.py` pins this file against CLAUDE.md, so the runner,
# the Python version and the test command cannot drift apart from the prose a
# reader opens. It is not a YAML parser and cannot tell you this file is valid.

name: checks

on:
  # The route a locally-merged branch takes. `03f5adf` merged #142 with
  # `git merge --no-ff` and pushed, so the GitHub merge button was never in the
  # path -- a `pull_request` trigger alone would have watched the wrong door.
  push:
    branches: [main]
  # Checks out the *merge result* rather than the branch head, which is the
  # tree the ticket is about. GitHub recomputes that only when the branch
  # moves, so a PR opened before another one lands can still go green on a
  # stale merge; the `push` trigger above is what catches that on the way in.
  pull_request:
    # A PR body is written after its commits and can be edited again without a
    # branch update. `edited` is the surface #183 found after commit messages
    # were already clean; the other three preserve GitHub's default triggers.
    types: [opened, synchronize, reopened, edited]
  # A merge that has already landed is the one moment somebody wants to re-run
  # a check against a tree neither parent had.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  suite:
    name: suite + PHI shape layer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # A push may carry more than one commit. Its `before..sha` range must
          # exist locally or the last clean message can hide an earlier hazard.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # Quoted deliberately: unquoted `3.10` is the float 3.1. Matches the
          # machine this repo is actually worked on, so a red run here means a
          # red run there -- ADR 0002 decision 3.
          python-version: '3.14'

      - name: Interpreter
        run: python -VV

      # #183 has three surfaces. The local hook sees commit messages, while a
      # PR title/body is created later and the final merge message later still.
      # A PR run grades its metadata and every commit message through GitHub's
      # own JSON. Under ADR 0073's measured grammar its exit status is the step
      # verdict; no later command consumes or replaces it.
      - name: Closing keyword scan, pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $pr = Join-Path $env:RUNNER_TEMP 'pull-request.json'
          gh pr view $env:PR_NUMBER --json title,body,commits |
            Out-File -FilePath $pr -Encoding utf8
          python tools/closing_keyword_scan.py --github-json $pr

      # A push to main is detection after GitHub may already have acted, so it
      # keeps the advisory posture. The scanner runs last and its exit status is
      # the verdict; no later command consumes or replaces it.
      - name: Closing keyword scan, advisory push or manual run
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            git log --format=%B "$env:BEFORE_SHA..$env:GITHUB_SHA" |
              python tools/closing_keyword_scan.py -
          } else {
            git log -1 --format=%B | python tools/closing_keyword_scan.py -
          }

      - name: Receipt plan scan, advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          $pr = Join-Path $env:RUNNER_TEMP 'pull-request.json'
          python tools/tracker_merge_receipt.py --check-plan $pr

      # Before the suite, so it is on the page even when the suite dies. The
      # report is computed by the scanner from its own inputs rather than
      # written out here: a banner typed into YAML is a claim about `phi_scan`
      # that `phi_scan` does not make and nothing re-derives.
      - name: What this job can and cannot check for PHI
        run: |
          $report = python tools/phi_scan.py --layers --all
          $report
          @('### PHI scan coverage', '', '```', $report, '```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Stdlib only -- nothing to install, no package manager, no lockfile.
      # Every PyMuPDF import in `tools/` sits inside the function that opens the
      # file, so this resolves nothing however far the suite grows. Deliberately
      # no test count here: `test_nothing_is_installed` carries the claim, and a
      # figure in a comment is #143 waiting to happen -- the first draft of this
      # line said 1093 and was stale inside its own branch.
      - name: Test suite
        run: python -m unittest discover -s tools -t tools

      # The pre-commit hook can refuse a threshold-sheet edit, but it does not
      # run on an automatic merge commit. The runner cannot hold the clinical
      # source corpus or second-read records, so the tool itself says which
      # gates did not run; the workflow does not reinterpret that report or
      # its exit status. Capture the report before preserving the exit status
      # so the same caveats appear on the page carrying the checkmark. #190.
      - name: Threshold sheet gates, external evidence may not run
        if: always()
        run: |
          $report = python tools/threshold_sheet.py --all 2>&1
          $status = $LASTEXITCODE
          $report
          @('### Threshold sheet gate coverage', '', '```', $report, '```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      # `scratch/` is gitignored PHI and must never reach a runner, so the
      # corpus layer is dead here on every run that will ever happen. The step
      # is named for what it is: a green check beside these words is "no
      # PHI-shaped strings", never "no PHI". #86's trap, answered rather than
      # walked into.
      #
      # `--allow-no-corpus` because since #93 an absent corpus is exit 2 -- "did
      # not scan" -- which would otherwise make this step red on every run
      # forever, and a check that can never be green checks nothing. The flag
      # sitting here IS the record that this job knowingly runs a layer short,
      # readable by anyone opening the file. Deliberately not `if: $LASTEXITCODE
      # -eq 2` in this YAML: that would be a judgment about `phi_scan` that
      # `phi_scan` does not make and nothing re-derives, which is the same
      # objection the layer-report step above exists to answer. It buys the exit
      # status and nothing else -- the degradation still prints.
      - name: PHI shape layer only, corpus layer cannot run in CI
        if: always()
        run: python tools/phi_scan.py --all --allow-no-corpus
