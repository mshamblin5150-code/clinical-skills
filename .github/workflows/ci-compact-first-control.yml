# Local preparation only. Publication and one hosted run need separate approval.
name: synthetic compact first control

on:
  push:
    branches-ignore: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/2013-parallel-proof-20261020' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record origin before checkout and interpreter setup
        shell: pwsh
        run: |
          "PROOF_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exact observer checkout for raw-object authentication, not application execution
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: observer
          fetch-depth: 1
          persist-credentials: false

      - name: Exact interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Fresh calibration and versioned first-control property; diagnostic only
        shell: pwsh
        run: |
          python observer/diagnostics/validate_compact_first_control.py --replacement-property-v1 --observer observer --job-start-epoch $env:PROOF_JOB_START_EPOCH
          exit $LASTEXITCODE
