name: CI serial envelope qualification

# Private candidate only. Parent custody, not concurrency, supplies single-use
# admission. No workflow_dispatch, pull_request, main push or measurement path.
on: create

permissions:
  contents: read

concurrency:
  group: diagnostic-2013-envelope-qualification-once
  cancel-in-progress: false

jobs:
  qualification:
    name: Synthetic Windows envelope qualification
    if: >-
      github.repository == 'mshamblin5150-code/clinical-skills' &&
      github.event_name == 'create' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'diagnostic/2013-envelope-qual-once-20261101' &&
      github.ref == 'refs/heads/diagnostic/2013-envelope-qual-once-20261101' &&
      github.run_attempt == 1
    runs-on: windows-2025-vs2026
    timeout-minutes: 11
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Admit conservative job clock before setup
        id: clock
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [Environment]::TickCount64
          $utcStart = [DateTimeOffset]::UtcNow
          # Exactly one anonymous public metadata read. Missing/stale metadata
          # fails admission; no retry, credential grant or reset to step time.
          $url = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$env:GH_RUN_ID/jobs?filter=latest&per_page=100"
          $response = Invoke-WebRequest -Uri $url -TimeoutSec 5 -MaximumRedirection 0 -Headers @{Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'Cache-Control'='no-cache'}
          $received = [Environment]::TickCount64
          $utcReceived = [DateTimeOffset]::UtcNow
          if ($received - $start -gt 5000) { throw 'clock metadata latency refused' }
          $body = $response.Content | ConvertFrom-Json
          $jobs = @($body.jobs | Where-Object { $_.name -eq 'Synthetic Windows envelope qualification' -and $_.status -eq 'in_progress' -and $_.head_sha -eq $env:GH_HEAD_SHA })
          if ($body.total_count -ne 1 -or $jobs.Count -ne 1) { throw 'unique job clock unavailable' }
          $server = [DateTimeOffset]::Parse(@($response.Headers['Date'])[0], [Globalization.CultureInfo]::InvariantCulture)
          if ($response.Headers['Age'] -and [long]@($response.Headers['Age'])[0] -ne 0) { throw 'cached clock metadata refused' }
          if ($server -lt $utcStart.AddSeconds(-2) -or $server -gt $utcReceived.AddSeconds(2)) { throw 'clock agreement unavailable' }
          $jobStarted = [DateTimeOffset]::Parse($jobs[0].started_at, [Globalization.CultureInfo]::InvariantCulture)
          $age = [long][Math]::Ceiling(($server - $jobStarted).TotalMilliseconds)
          # Second precision and observed wall-clock agreement are assumptions.
          # Move the origin five seconds earlier; never claim exact physical time.
          if ($age -lt 0 -or $age -gt 180000) { throw 'job clock age refused' }
          $origin = $start - $age - 5000
          if ($origin -lt 0 -or $received - $origin -ge 180000) { throw 'setup allowance exhausted' }
          "job_start_ms=$origin" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          @{kind='clock_admission'; job_id=$jobs[0].id; server_date=$server.ToString('o'); job_started=$jobStarted.ToString('o'); utc_request=$utcStart.ToString('o'); utc_received=$utcReceived.ToString('o'); request_ticks=$start; received_ticks=$received; conservative_job_start_ms=$origin; uncertainty='server/VM clock agreement and uncached API observation; no physical-stop guarantee'} | ConvertTo-Json -Compress

      - name: Checkout reviewed qualification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            diagnostics
            .github/workflows/ci-serial-envelope-qualification.yml
          sparse-checkout-cone-mode: false

      - name: Provision exact disclosed interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.4'
          architecture: x64
          check-latest: false

      - name: Run exactly eleven serial synthetic controls once
        env:
          JOB_START_MS: ${{ steps.clock.outputs.job_start_ms }}
          QUAL_RUN_ID: ${{ github.run_id }}
          QUAL_ATTEMPT: ${{ github.run_attempt }}
          QUAL_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Environment]::TickCount64 - [long]$env:JOB_START_MS -ge 180000) { throw 'setup window exhausted; no controls' }
          python -B diagnostics/test_windows_serial_envelope.py --job-start-ms $env:JOB_START_MS --module-sha c6dce5a1808ba258e3f672118a47b9e72854c245751b7e233edd64b3b56759c2 --fixture-sha fab5fdae338beb5eb30a02240d1d1c35b8172a380f1f112a3071a4320a023512 --tests-sha f996d3ee3b1ef9eef0dbedab12a4f33e6d8dd0e7177518881a6b020650d01535 --run-id $env:QUAL_RUN_ID --attempt $env:QUAL_ATTEMPT --commit $env:QUAL_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain bounded safe terminal summary
        if: always()
        env:
          JOB_START_MS: ${{ steps.clock.outputs.job_start_ms }}
          QUAL_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:JOB_START_MS -or [Environment]::TickCount64 - [long]$env:JOB_START_MS -ge 660000) { throw 'terminal clock unavailable or exhausted; inconclusive' }
          $path = "scratch/sessions/2013-qualification-$env:QUAL_RUN_ID-1/qualification-terminal.json"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'terminal proof absent; inconclusive' }
          if ((Get-Item -LiteralPath $path).Length -gt 32768) { throw 'terminal size refused' }
          $text = [IO.File]::ReadAllText((Join-Path $pwd $path))
          $receipt = $text | ConvertFrom-Json
          if ($receipt.kind -ne 'qualification_terminal' -or $receipt.measurement_admitted -ne $false) { throw 'terminal protocol refused' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $text
          # Receipt custody belongs to the coordinator. No artifact upload,
          # automatic cleanup, repeat control or measurement follows.
