# Consumed timing-screen evidence retained. Branch and tag push routes are disabled.
name: threshold module timing screen

on:
  push:
    branches-ignore: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  measurement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/2013-parallel-proof-20261020' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Record whole-job origin before checkout and setup
        shell: pwsh
        run: |
          "PROOF_JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Immutable observer and exact one-file test candidate
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: observer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /diagnostics/
            /.github/workflows/ci-parallel-proof.yml
            /.github/workflows/ci-checkpoint-discovery.yml
            /.github/workflows/ci-reader-attribution.yml
            /.github/workflows/ci-threshold-module.yml
            /tools/test_threshold_sheet.py
            /tools/test_suite_ids.py
            /tools/console_codec.py
            /tools/python_floor.py
            /tools/git_paths.py

      - name: Pinned independent full source, no newline conversion
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 08db6360b453c2bf969a686f62f0477184d06351
          path: source-seed
          fetch-depth: 0
          persist-credentials: false

      - name: Exact interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Qualify baseline before candidate, then compare four original calls
        shell: pwsh
        run: |
          python observer/diagnostics/measure_threshold_module.py --observer observer --seed source-seed --job-start-epoch $env:PROOF_JOB_START_EPOCH
          exit $LASTEXITCODE
