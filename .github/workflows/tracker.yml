# Scan the tracker record at the event that publishes it. Issue #260.
#
# This is deliberately incremental. Re-harvesting the whole tracker on every
# comment would replay #264's ruled historical findings forever; scanning the
# changed record makes a red run belong to the edit that caused it.
#
# Advisory on the repository's standing CI ruling. The workflow guarantees the
# detector ran; branch protection is the only place that could make it a gate.

name: tracker PHI shape layer

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, closed]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  changed-record:
    name: tracker PHI shape layer only
    # A review submission may be only an approval state, with no public text.
    # There is then no record for this text scanner to read and no scan to fail.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request_review' ||
       (github.event.review.body != null && github.event.review.body != '')) &&
      (github.event.action != 'edited' ||
       github.event.changes.title != null || github.event.changes.body != null)
    runs-on: windows-latest

    steps:
      # `pull_request_target` carries a token for the base repository. Check out
      # the trusted default branch explicitly; no pull-request code executes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Changed tracker record; corpus layer cannot run in CI
        run: |
          $report = python tools/tracker_scan.py --github-event $env:GITHUB_EVENT_PATH --event-name $env:GITHUB_EVENT_NAME --allow-no-corpus
          $status = $LASTEXITCODE
          $report
          @('### Tracker PHI scan coverage', '', '```', $report, '```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      - name: Branch scope for in-flight issue text
        if: >-
          always() &&
          (github.event_name == 'issues' || github.event_name == 'issue_comment')
        run: >-
          python tools/tracker_branch_scope.py
          --github-event $env:GITHUB_EVENT_PATH
          --event-name $env:GITHUB_EVENT_NAME

  merge-receipts:
    name: immutable ticket merge receipts
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      # The privileged event never executes pull-request code. The parser and
      # workflow both come from the trusted default branch after the merge.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Publish one immutable receipt per explicitly referenced ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $plan = Join-Path $env:RUNNER_TEMP 'tracker-merge-receipts.jsonl'
          gh pr view $env:PR_NUMBER --json number,url,title,body,baseRefName,mergedAt,mergeCommit,commits |
            python tools/tracker_merge_receipt.py - |
            Out-File -FilePath $plan -Encoding utf8
          $status = $LASTEXITCODE
          Get-Content -LiteralPath $plan | ForEach-Object {
            $receipt = $_ | ConvertFrom-Json
            gh issue comment $receipt.ticket --body $receipt.body
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($status -ne 0) { exit $status }
